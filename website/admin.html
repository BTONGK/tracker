<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topolist — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f1eb;
      --card: #fff;
      --border: rgba(0,0,0,0.07);
      --text: #1a1410;
      --text-2: #5a4e42;
      --text-3: #9a8e82;
      --accent: #e8407a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Auth gate ── */
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 36px 32px;
      width: 100%; max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .auth-logo { font-size: 15px; font-weight: 700; margin-bottom: 24px; color: var(--text); }
    .auth-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .auth-input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 14px;
      background: var(--bg); color: var(--text); outline: none;
      transition: border-color 0.15s;
    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-btn {
      width: 100%; margin-top: 12px; padding: 11px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .auth-btn:hover { opacity: 0.88; }
    .auth-err { font-size: 12px; color: #e74c3c; margin-top: 8px; min-height: 16px; }

    /* ── Dashboard ── */
    .dash { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
    }
    .dash-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .dash-meta { font-size: 12px; color: var(--text-3); }
    .refresh-btn {
      padding: 7px 14px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--card); font-family: inherit; font-size: 13px;
      color: var(--text-2); cursor: pointer; transition: border-color 0.15s;
    }
    .refresh-btn:hover { border-color: var(--text-3); }

    /* ── Stat cards ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 20px 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }
    .card-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; color: var(--text); line-height: 1; }
    .card-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .card--accent .card-value { color: var(--accent); }

    /* ── Breakdown panels ── */
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    @media (max-width: 600px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }
    .panel-title { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-name { font-size: 13px; color: var(--text-2); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 6px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }
    .bar-count { font-size: 12px; font-weight: 600; color: var(--text-3); width: 24px; text-align: right; }

    .empty { font-size: 13px; color: var(--text-3); padding: 8px 0; }

    /* ── Status pills ── */
    .status-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-label { font-size: 12px; color: var(--text-2); }
    .status-num { font-size: 14px; font-weight: 700; color: var(--text); }

    /* ── Last activity ── */
    .activity-panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .activity-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
    .activity-value { font-size: 15px; font-weight: 600; color: var(--text); }
    .activity-rel { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .loading { text-align: center; padding: 80px 0; color: var(--text-3); font-size: 14px; }
  </style>
</head>
<body>

<div id="auth-gate" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Topolist Admin</div>
    <div class="auth-label">Admin secret</div>
    <input class="auth-input" id="secret-input" type="password" placeholder="Enter your admin secret…" autocomplete="off" />
    <div class="auth-err" id="auth-err"></div>
    <button class="auth-btn" id="auth-btn">View stats →</button>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="dash">
    <div class="dash-header">
      <div>
        <div class="dash-title">Analytics</div>
        <div class="dash-meta" id="as-of">—</div>
      </div>
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    </div>

    <div id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<script>
const API = 'https://task-api-production-5269.up.railway.app'
let _secret = ''

function timeAgo(iso) {
  if (!iso) return 'never'
  const diff = Date.now() - new Date(iso)
  const m = Math.floor(diff / 60000)
  if (m < 1) return 'just now'
  if (m < 60) return `${m}m ago`
  const h = Math.floor(m / 60)
  if (h < 24) return `${h}h ago`
  return `${Math.floor(h / 24)}d ago`
}

function bars(obj, total) {
  const entries = Object.entries(obj).sort((a, b) => b[1] - a[1])
  if (!entries.length) return '<div class="empty">No data yet</div>'
  return entries.map(([k, v]) => `
    <div class="bar-row">
      <div class="bar-name" title="${k}">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${total ? Math.round(v/total*100) : 0}%"></div></div>
      <div class="bar-count">${v}</div>
    </div>`).join('')
}

function render(d) {
  document.getElementById('as-of').textContent = `Updated ${timeAgo(d.asOf)}`

  const totalTasks = d.totalTasks || 0
  const sourceTotal = Object.values(d.sources).reduce((a, b) => a + b, 0)
  const actionTotal = Object.values(d.actionTypes).reduce((a, b) => a + b, 0)

  document.getElementById('content').innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="card-label">Users</div>
        <div class="card-value">${d.users}</div>
        <div class="card-sub">${d.atLimit} at 10-task limit</div>
      </div>
      <div class="card">
        <div class="card-label">Total tasks</div>
        <div class="card-value">${totalTasks}</div>
        <div class="card-sub">${d.avgTasksPerUser} avg per user</div>
      </div>
      <div class="card card--accent">
        <div class="card-label">Created today</div>
        <div class="card-value">${d.createdToday}</div>
        <div class="card-sub">${d.createdThisWeek} this week</div>
      </div>
      <div class="card">
        <div class="card-label">Limit reached</div>
        <div class="card-value">${d.atLimit}</div>
        <div class="card-sub">of ${d.users} users</div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title">Sources</div>
        ${bars(d.sources, sourceTotal)}
      </div>
      <div class="panel">
        <div class="panel-title">Action types</div>
        ${bars(d.actionTypes, actionTotal)}
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title">Task status</div>
        <div class="status-row">
          <div class="status-pill">
            <div class="status-dot" style="background:#9ca3af"></div>
            <div>
              <div class="status-label">To Do</div>
              <div class="status-num">${d.statuses.todo || 0}</div>
            </div>
          </div>
          <div class="status-pill">
            <div class="status-dot" style="background:#f59e0b"></div>
            <div>
              <div class="status-label">In Progress</div>
              <div class="status-num">${d.statuses.in_progress || 0}</div>
            </div>
          </div>
          <div class="status-pill">
            <div class="status-dot" style="background:#10b981"></div>
            <div>
              <div class="status-label">Done</div>
              <div class="status-num">${d.statuses.done || 0}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="activity-panel">
        <div>
          <div class="activity-label">Last activity</div>
          <div class="activity-value">${d.lastActivity ? new Date(d.lastActivity).toLocaleString() : '—'}</div>
          <div class="activity-rel">${timeAgo(d.lastActivity)}</div>
        </div>
        <div>
          <div class="activity-label">Limit</div>
          <div class="activity-value">${d.taskLimit} tasks / user</div>
        </div>
      </div>
    </div>`
}

async function load() {
  document.getElementById('content').innerHTML = '<div class="loading">Loading…</div>'
  try {
    const r = await fetch(`${API}/admin/stats?secret=${encodeURIComponent(_secret)}`)
    if (r.status === 401) { document.getElementById('auth-err').textContent = 'Wrong secret.'; showAuth(); return }
    if (!r.ok) throw new Error()
    render(await r.json())
  } catch {
    document.getElementById('content').innerHTML = '<div class="loading">Failed to load — check the API is running.</div>'
  }
}

function showAuth() {
  document.getElementById('auth-gate').style.display = 'flex'
  document.getElementById('dashboard').style.display = 'none'
}

function showDash() {
  document.getElementById('auth-gate').style.display = 'none'
  document.getElementById('dashboard').style.display = 'block'
  load()
}

document.getElementById('auth-btn').addEventListener('click', () => {
  const val = document.getElementById('secret-input').value.trim()
  if (!val) return
  _secret = val
  sessionStorage.setItem('admin_secret', val)
  document.getElementById('auth-err').textContent = ''
  showDash()
})

document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click()
})

document.getElementById('refresh-btn').addEventListener('click', load)

// Auto-login if secret saved this session
const saved = sessionStorage.getItem('admin_secret')
if (saved) { _secret = saved; showDash() }
</script>
</body>
</html>
